<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17120f" />
    <title>Offline | Jyoti Verma</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #17120f; color: #f7efe8; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
      main { width: min(100%, 520px); padding: 36px; border: 1px solid #48362b; border-radius: 22px; background: linear-gradient(145deg, #2b201a, #191410); box-shadow: 12px 16px 34px #0008, inset 2px 2px 4px #fff1; }
      p { color: #b7a69a; line-height: 1.7; }
      a { display: inline-flex; min-height: 44px; align-items: center; margin-top: 12px; padding: 0 18px; border-radius: 11px; background: #e5ad8d; color: #211914; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p>JYOTI VERMA · PORTFOLIO</p>
      <h1>You’re offline right now.</h1>
      <p>Reconnect to the internet and try again. Previously visited pages may still be available.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
